- defaults:
    link:
      relink: true
      create: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ["~"]

- link:
    ~/.config/systemd/user/proton-pass-ssh-agent.service: .config/systemd/user/proton-pass-ssh-agent.service
    ~/.config/fish/config.fish: .config/fish/config.fish
    ~/.config/fish/themes: .config/fish/themes
    ~/.config/mise/: .config/mise/
    ~/.config/atuin/config.toml: .config/atuin/config.toml
    ~/.config/fastfetch/config.jsonc: .config/fastfetch/config.jsonc
    ~/.config/starship.toml: .config/starship.toml
    ~/.config/topgrade.toml: .config/topgrade.toml
    ~/.config/bat/: .config/bat/
    ~/.config/btop/: .config/btop/

- create:
    - ~/i

- shell:
    - command: scripts/apt.sh
      description: Add apt repositories, update, and install
    - command: scripts/mise.sh
      description: Install mise and packages
    - command: scripts/fish.sh
      description: Install fisher and fish plugins
    - command: scripts/gh.sh
      description: Authenticate github cli, and set up GPG signing
