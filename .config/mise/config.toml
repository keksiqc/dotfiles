#:schema https://mise.jdx.dev/schema/mise.json
#:tombi schema.strict = false

[tool_alias]
pass-cli = "aqua:protonpass/pass-cli"
ansible-lint = "pypi:ansible-lint"

[tools]
# Internals
watchexec = "latest"
aube = "latest"

# Languages & runtimes
bun = "latest"
deno = "latest"
go = "latest"
node = "latest"
python = "latest"
rust = "latest"

# Package managers
ni = "latest"
nub = "latest"
pipx = "latest"
pnpm = "latest"
uv = "latest"

# CLI tools
atuin = "latest"
bat = "latest"
dust = "latest"
hk = "latest"
gdu = "latest"
gh = "latest"
topgrade = "latest"
viteplus = "latest"
oxfmt = "latest"
oxlint = "latest"
pass-cli = "latest"

# GitHub Actions
act = "latest"
jactionlint = "latest"
pinact = "latest"
zizmor = "latest"

# AI tools
claude = "latest"
codex = "latest"
pi = "latest"
opencode = "latest"

[settings]
experimental = true
install_layout = "identity"
auto_install = true
self_update.auto = true
idiomatic_version_file_enable_tools = ["python", "node"]
trusted_config_paths = ["~/i"]

[settings.python]
uv_venv_auto = "create|source"
compile = false
