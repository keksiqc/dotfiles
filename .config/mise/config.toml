[tools]
aube = "latest"
usage = "latest"
watchexec = "latest"

# Languages
uv = "latest"
python = "latest"
node = "latest"
bun = "latest"
deno = "latest"
go = "latest"

# CLI tools
ni = "latest"
nub = "latest"
pnpm = "latest"

# GitHub Actions
act = "latest"
actionlint = "latest"
pinact = "latest"
zizmor = "latest"

# AI tools
opencode = "latest"
claude = "latest"
codex = "latest"
pi = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]
trusted_config_paths = ["~/i"]

[settings.python]
uv_venv_auto = "create|source"
compile = false
